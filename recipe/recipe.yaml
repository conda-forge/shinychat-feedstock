schema_version: 1

context:
  version: "0.7.1"

package:
  name: shinychat
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/shinychat/shinychat-${{ version }}.tar.gz
  sha256: c49b7df2890e1abd80613f411a81122fff15ea8c161a995eee387188bf4e4fea

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >=${{ python_min }}
    - htmltools >=0.7.0
    - shiny >=1.4.0
    - pydantic

tests:
  - python:
      imports:
        - shinychat
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: An AI Chat interface for Shiny apps.
  license: MIT
  license_file: LICENSE
  homepage: https://posit-dev.github.io/shinychat/
  documentation: https://posit-dev.github.io/shinychat/py/

extra:
  recipe-maintainers:
    - schloerke
