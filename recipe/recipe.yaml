schema_version: 1

context:
  version: "0.7.2"

package:
  name: shinychat
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/shinychat/shinychat-${{ version }}.tar.gz
  sha256: de83aa829ef84c86f69dd9b76647d5630090264b5be977a2d2fe8ee37dbd71c0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >=${{ python_min }}
    - htmltools >=0.7.0
    - libsass >=0.23.0
    - shiny >=1.7.0
    - pydantic >=2.11

tests:
  - python:
      imports:
        - shinychat
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: An AI Chat interface for Shiny apps.
  license: MIT
  license_file: LICENSE
  homepage: https://posit-dev.github.io/shinychat/
  documentation: https://posit-dev.github.io/shinychat/py/

extra:
  recipe-maintainers:
    - schloerke
